    {
      "@type": "PresentationDigitalDocument",
      "name": "Digital Identity Optimization for Open-Source Projects",
      "description": "Title and central proposition.",
      "text": "Maintaining project identity across code, registries, community, governance, and AI systems. Digital Identity Optimization appears to be one of the few systems complex enough to maintain the identity of something as unstable, distributed, and constantly evolving as an open-source project.",
      "position": 1,
      "url": "#slide-1"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "What does it mean for an open-source project to remain the same project?",
      "description": "The identity-continuity question.",
      "text": "An open-source project can change its maintainers, organization, repository location, package name, license, governance structure, documentation, and infrastructure — yet users and contributors may still understand it as the same project. Repository moves, maintainers change, the package is renamed, and the central question remains: what remains invariant when everything around the project changes?",
      "position": 2,
      "url": "#slide-2"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Why open source is an ideal laboratory for DIO",
      "description": "Open source as a demanding DIO environment.",
      "text": "An open-source project is a single logical entity distributed across many heterogeneous surfaces. It is an unusually demanding environment for testing whether an identity framework can preserve coherence across change. Technical surfaces include repositories, packages, releases, documentation, dependencies, and security records. Human surfaces include maintainers, contributors, forks, discussions, tutorials, and community memory. Machine surfaces include knowledge graphs, search results, AI-generated descriptions, and recommendations. One project. Many representations. No single surface contains the whole identity.",
      "position": 3,
      "url": "#slide-3"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "The project is not the repository",
      "description": "The distributed identity graph of an open-source project.",
      "text": "The project is not the repository. It is a distributed identity graph spanning code, community, governance, trust, and machine reconstruction. It is represented across GitHub repositories, package registries, documentation, security advisories, contributors, maintainers, forks, company or foundation structures, releases, governance, sponsors, community discussions, Wikipedia or Wikidata, AI-generated descriptions, and AI recommendations. Each surface contributes a partial signal. DIO maintains coherence across the graph.",
      "position": 4,
      "url": "#slide-4"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Digital Identity Optimization: beyond SEO and content tweaks",
      "description": "DIO operates at the level of the entity.",
      "text": "DIO is not primarily about optimizing a page, a keyword, a code snippet, or a single answer. It manages the identity of an entity across the systems in which that identity is represented and interpreted. SEO optimizes pages and documents for keyword-document matching. AIO and AEO optimize quotable content for AI-generated answers. DIO optimizes coherence across the project’s distributed identity. DIO treats the open-source project as a full-fledged digital entity — not merely as a repository URL, package name, or collection of code files.",
      "position": 5,
      "url": "#slide-5"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "From pages to answers to entities",
      "description": "Three generations of visibility.",
      "text": "SEO addresses the web document: object, web document; mechanism, keyword-document matching; output, ranked page. AIO and AEO address the information fragment: object, information fragment; mechanism, quotable content; output, answer inclusion. DIO addresses the digital entity: object, digital entity; mechanism, coherent representation; output, entity recommendation. Applying DIO means moving beyond optimizing documentation or answers to optimizing the project as a stable entity.",
      "position": 6,
      "url": "#slide-6"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Entity → Representation → Interpretation → Trust → Relationship → Reconstruction",
      "description": "The DIO identity cycle applied to open source.",
      "text": "The DIO identity cycle describes how an entity becomes legible and persistent across heterogeneous systems. Entity: name, purpose, scope, ecosystem, license, and governance. Representation: repository, package, README, documentation, releases, security, and talks. Interpretation: how people, search systems, knowledge graphs, and LLMs infer what the project is. Trust: adoption, maintenance, CI health, security, cadence, and transparency. Relationship: contributors, maintainers, forks, sponsors, foundations, and adopters. Reconstruction: how AI assembles signals and decides what to recommend.",
      "position": 7,
      "url": "#slide-7"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Human-facing, technical, and AI reconstruction",
      "description": "The three DIO domains.",
      "text": "Human-Facing Interpretation includes the README, website, documentation, tutorials, talks, contribution guidelines, issue templates, and community discussions; it shapes meaning in human minds. Pre-AI Technical Representation includes repository and registry metadata, structured data, canonical URLs, versions, tags, licenses, advisories, and knowledge graphs. AI-Mediated Reconstruction includes AI search, generated summaries, recommendations, RAG systems, generated documentation, and origin-versus-fork disambiguation. A DIO implementation must work across all three domains simultaneously.",
      "position": 8,
      "url": "#slide-8"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Where open-source project identity breaks down",
      "description": "Identity Collapse and AI Hesitation failure modes.",
      "text": "Fork confusion means forks, descendants, and abandoned variants are mistaken for the canonical project. Repository drift means the repository moves, but old URLs and descriptions remain active elsewhere. Package fragmentation means multiple names, scopes, registries, and legacy identifiers lack clear relationships. Documentation divergence means different versions describe different project states. Governance ambiguity means the roles of maintainers, foundations, sponsors, and companies are unclear. Trust-surface fragmentation means releases, security, issue activity, and maintenance signals are disconnected. Identity Collapse occurs when related representations fail to resolve into one coherent project identity. AI Hesitation occurs when an AI system cannot confidently identify, distinguish, or recommend the correct project.",
      "position": 9,
      "url": "#slide-9"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Implementing DIO on one open-source project",
      "description": "Six-step implementation process.",
      "text": "Implementing DIO is not adding keywords to a README. It is a structured process from diagnosis to reconstruction, semantic infusion, and validation. Step 1: detect discrepancies by inventorying repositories, registries, docs, releases, forks, community, security, knowledge graphs, and AI descriptions. Step 2: calibrate the identity vector by defining the problem, users, category, distinctiveness, ecosystem, and core promise. Step 3: deconstruct the signals by examining the README, docs, templates, licenses, policies, and release notes. Step 4: synthesize and reconstruct by defining canonical naming, project history, relationships, governance, and version structure. Step 5: infuse semantic coherence by applying the model across repository, registries, website, docs, community, and knowledge surfaces. Step 6: validate and iterate by testing human, search, AI, package-discovery, and documentation interpretations.",
      "position": 10,
      "url": "#slide-10"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "DIO turns scattered signals into a coherent identity system",
      "description": "Before and after DIO.",
      "text": "Before DIO, the repository says one thing, the registry uses another name, documentation preserves legacy language, forks are not contextualized, and AI descriptions mix variants. After DIO, canonical identity is explicit, repository and package relationships are clear, documentation reflects the current state, governance and history are legible, and AI receives a coherent identity footprint. DIO does not erase change. It makes change interpretable.",
      "position": 11,
      "url": "#slide-11"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "What an open-source project gains from DIO",
      "description": "Benefits of DIO implementation.",
      "text": "An open-source project gains canonical identity: users and systems can identify the primary project, package, docs, and version. It gains continuity: the project remains recognizable when people, organizations, or infrastructure change. It gains disambiguation: forks, abandoned variants, and similarly named tools become distinguishable. It gains a trust surface: maintenance, releases, security, governance, and relationships reinforce each other. It gains better AI reconstruction: AI systems have a clearer basis for describing and recommending the project. DIO does not manufacture trust. It makes existing identity and trust signals more coherent, legible, and relationally interpretable.",
      "position": 12,
      "url": "#slide-12"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "An unstable project identity before and after DIO",
      "description": "Hypothetical open-source mini-case.",
      "text": "Imagine a library that changed its name, moved repositories, acquired new maintainers, published old and new package identifiers, accumulated forks, retained legacy documentation, and became inconsistently described by AI systems. Before intervention there is no clear canonical repository, package names are mixed, documentation is outdated, and AI recommendations point to inconsistent artifacts. The intervention maps canonical project identity, history, forks, maintainers, packages, governance, security, and public descriptions, then standardizes naming and relationships. Afterward, the project remains identifiable across historical changes, and humans and AI can distinguish origin, fork, current version, and use case. DIO does not freeze the project. It preserves the intelligibility of its continuity.",
      "position": 13,
      "url": "#slide-13"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "DIO as a general identity model — and OSS as its stress test",
      "description": "DIO beyond a single application domain.",
      "text": "If the same model works for an open-source project, an enterprise, an NGO, an academic researcher, and a public institution, DIO may be more than a method for optimizing digital identity. Through the sequence Entity → Representations → Interpretations → Trust → Relationships → Reconstruction, it may be a general model of how digital entities acquire, maintain, and reconstruct identity across heterogeneous information systems. Open source is not merely another application domain. It is a demanding test of whether the model can survive real-world change.",
      "position": 14,
      "url": "#slide-14"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Select one project. Run full DIO.",
      "description": "Research and implementation proposition.",
      "text": "Select an active open-source project with a complex identity footprint and implement DIO across its major surfaces. Choose a project with an active repository and releases, package registry presence, forks or descendants, a contributor community, public documentation, security and governance signals, and visible AI or search presence. Then measure the identity: can humans identify the canonical project, can users distinguish forks and versions, are package relationships clear, do AI systems describe it consistently, and are trust signals legible? The implementation becomes both a practical intervention and a case study of DIO’s general applicability.",
      "position": 15,
      "url": "#slide-15"
    },
    {
      "@type": "PresentationDigitalDocument",
      "name": "Sources and final proposition",
      "description": "Sources and concluding proposition.",
      "text": "Beránek, D. (2026). Manifest of Digital Identity Optimization (DIO) and Ontology of Digital Identity (ODI): Canonical Multilingual Edition (Version 1.0.0). Zenodo. https://doi.org/10.5281/zenodo.21610934. Beránek, D. (2026). Digital Identity Optimization (DIO): A Conceptual Framework for Entity-Based Visibility in the Age of AI-Mediated Search. Zenodo. https://doi.org/10.5281/zenodo.21839423. An open-source project is not merely a repository of code. It is a living digital entity whose identity is continuously distributed across code, packages, documentation, forks, contributors, maintainers, releases, governance, security, community discourse, knowledge systems, and AI-generated reconstructions. The project changes. Its identity should remain intelligible.",
      "position": 16,
      "url": "#slide-16"
    }
  ]

slides.push(S('Definition','Digital Identity Optimization: beyond SEO and content tweaks',`<p>DIO is not primarily about optimizing a page, a keyword, a code snippet, or a single answer. It manages the identity of an entity across the systems in which that identity is represented and interpreted.</p><div class="grid c3">${card('SEO · Document','Optimizes pages and documents for keyword-document matching.')}${card('AIO / AEO · Information fragment','Optimizes quotable content for AI-generated answers.')}${card('DIO · Digital entity','Optimizes coherence across the project’s distributed identity.')}</div><div class="quote">DIO treats the open-source project as a full-fledged digital entity — not merely as a repository URL, package name, or collection of code files.</div>`));slides.push(S('Three generations','From pages to answers to entities',`<div class="grid c3">${card('1st generation · SEO','Object: web document<br><br>Mechanism: keyword-document matching<br><br>Output: ranked page')}${card('2nd generation · AIO / AEO','Object: information fragment<br><br>Mechanism: quotable content<br><br>Output: answer inclusion')}${card('3rd generation · DIO','Object: digital entity<br><br>Mechanism: coherent representation<br><br>Output: entity recommendation')}</div><div class="quote">Applying DIO means moving beyond optimizing documentation or answers to optimizing the project as a stable entity.</div>`));slides.push(S('Identity cycle','Entity → Representation → Interpretation → Trust → Relationship → Reconstruction',`<p>The DIO identity cycle describes how an entity becomes legible and persistent across heterogeneous systems.</p><div class="flow"><b>Entity</b><i>→</i><b>Representation</b><i>→</i><b>Interpretation</b><i>→</i><b>Trust</b><i>→</i><b>Relationship</b><i>→</i><b>Reconstruction</b></div><div class="grid c3">${card('Entity','Name, purpose, scope, ecosystem, license, governance.')}${card('Representation','Repository, package, README, docs, releases, security, talks.')}${card('Interpretation','How people, search systems, knowledge graphs, and LLMs infer what the project is.')}${card('Trust','Adoption, maintenance, CI health, security, release cadence, transparency.')}${card('Relationship','Contributors, maintainers, forks, sponsors, foundations, adopters.')}${card('Reconstruction','How AI assembles signals and decides what to recommend.')}</div>`));slides.push(S('Three DIO domains','Human-facing, technical, and AI reconstruction',`<div class="grid c3">${card('Human-Facing Interpretation','README, website, documentation, tutorials, talks, contribution guidelines, issue templates, and community discussions.<br><br><span style="color:#bbf7d0">Shapes meaning in human minds.</span>')}${card('Pre-AI Technical Representation','Repository and registry metadata, structured data, canonical URLs, versions, tags, licenses, advisories, and knowledge graphs.<br><br><span style="color:#bfdbfe">Encodes the project in machine-readable forms.</span>')}${card('AI-Mediated Reconstruction','AI search, generated summaries, recommendations, RAG systems, generated documentation, and origin-versus-fork disambiguation.<br><br><span style="color:#ede9fe">Reconstructs what the project is.</span>')}</div><div class="quote">A DIO implementation must work across all three domains simultaneously.</div>`));slides.push(S('Failure modes','Where open-source project identity breaks down',`<div class="grid c2">${card('Fork confusion','Forks, descendants, and abandoned variants are mistaken for the canonical project.')}${card('Repository drift','The repository moves, but old URLs and descriptions remain active elsewhere.')}${card('Package fragmentation','Multiple package names, scopes, registries, and legacy identifiers lack clear relationships.')}${card('Documentation divergence','Different versions describe different project states and do not identify the canonical one.')}${card('Governance ambiguity','The roles of maintainers, foundations, sponsors, and companies are unclear.')}${card('Trust-surface fragmentation','Releases, security, issue activity, and maintenance signals are disconnected.')}</div><div class="quote" style="border-color:var(--a);color:#fef3c7"><b>Identity Collapse:</b> related representations fail to resolve into one coherent project identity.<br><br><b>AI Hesitation:</b> an AI system cannot confidently identify, distinguish, or recommend the correct project.</div>`));
let steps=[['Detect discrepancies','Inventory repositories, registries, docs, releases, forks, community, security, knowledge graphs, and AI descriptions.'],['Calibrate the identity vector','Define the problem, users, category, distinctiveness, ecosystem, and core promise.'],['Deconstruct the signals','Examine README, docs, templates, licenses, policies, and release notes.'],['Synthesize and reconstruct','Define canonical naming, project history, relationships, governance, and version structure.'],['Infuse semantic coherence','Apply the model across repository, registries, website, docs, community, and knowledge surfaces.'],['Validate and iterate','Test human, search, AI, package-discovery, and documentation interpretations.']];slides.push(S('Implementation','Implementing DIO on one open-source project',`<p>Implementing DIO is not adding keywords to a README. It is a structured process from diagnosis to reconstruction, semantic infusion, and validation.</p><div class="grid c2">${steps.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${x[0]}</h3><p style="font-size:14px">${x[1]}</p></div></div>`).join('')}</div>`));slides.push(S('Practical effect','DIO turns scattered signals into a coherent identity system',`<div class="grid c2">${card('Before DIO',bul(['Repository says one thing.','Registry uses another name.','Documentation preserves legacy language.','Forks are not contextualized.','AI descriptions mix variants.']))}${card('After DIO',bul(['Canonical identity is explicit.','Repository and package relationships are clear.','Documentation reflects the current state.','Governance and history are legible.','AI receives a coherent identity footprint.']))}</div><div class="quote">DIO does not erase change. It makes change interpretable.</div>`));slides.push(S('Benefits','What an open-source project gains from DIO',`<div class="grid c3">${card('Canonical identity','Users and systems identify the primary project, package, docs, and version.')}${card('Continuity','The project remains recognizable when people, organizations, or infrastructure change.')}${card('Disambiguation','Forks, abandoned variants, and similarly named tools become distinguishable.')}${card('Trust surface','Maintenance, releases, security, governance, and relationships reinforce each other.')}${card('AI reconstruction','AI systems gain a clearer basis for describing and recommending the project.')}</div><p style="margin-top:20px;font-size:14px">DIO does not manufacture trust. It makes existing identity and trust signals more coherent, legible, and relationally interpretable.</p>`));slides.push(S('Hypothetical mini-case','An unstable project identity before and after DIO',`<p>Imagine a library that changed its name, moved repositories, acquired new maintainers, published old and new package identifiers, accumulated forks, retained legacy documentation, and became inconsistently described by AI systems.</p><div class="grid c3">${card('Before','No clear canonical repository. Mixed package names. Outdated documentation. AI recommendations point to inconsistent artifacts.')}${card('Intervention','Map canonical project, history, forks, maintainers, packages, governance, security, and public descriptions. Standardize naming and relationships.')}${card('After','The project remains identifiable across historical changes. Humans and AI can distinguish origin, fork, current version, and use case.')}</div><div class="quote">DIO does not freeze the project. It preserves the intelligibility of its continuity.</div>`));slides.push(S('General model','DIO as a general identity model — and OSS as its stress test',`<p>If the same model works for an open-source project, an enterprise, an NGO, an academic researcher, and a public institution, DIO may be more than a method for optimizing digital identity.</p><div class="flow"><b>Entity</b><i>→</i><b>Representations</b><i>→</i><b>Interpretations</b><i>→</i><b>Trust</b><i>→</i><b>Relationships</b><i>→</i><b>Reconstruction</b></div><div class="quote">It may be a general model of how digital entities acquire, maintain, and reconstruct identity across heterogeneous information systems.</div><p style="margin-top:20px">Open source is not merely another application domain. It is a demanding test of whether the model can survive real-world change.</p>`));slides.push(S('Research proposition','Select one project. Run full DIO.',`<p>Select an active open-source project with a complex identity footprint and implement DIO across its major surfaces.</p><div class="grid c2">${card('Choose a project with',bul(['Active repository and releases','Package registry presence','Forks or descendants','Contributor community','Public docs, security, and governance','Visible AI or search presence']))}${card('Measure the identity',bul(['Can humans identify the canonical project?','Can users distinguish forks and versions?','Are package and repository relationships clear?','Do AI systems describe it consistently?','Does AI recommend the correct project?','Are trust signals legible?']))}</div><div class="quote">The implementation becomes both a practical intervention and a case study of DIO’s general applicability.</div>`));slides.push(S('Sources and final proposition','The project changes. Its identity should remain intelligible.',`<div class="sources"><p class="source"><b>Beránek, D.</b> (2026). <em>Manifest of Digital Identity Optimization (DIO) and Ontology of Digital Identity (ODI): Canonical Multilingual Edition (Version 1.0.0)</em> [Dataset]. Zenodo. <a href="https://doi.org/10.5281/zenodo.21610934" target="_blank">https://doi.org/10.5281/zenodo.21610934</a></p><p class="source"><b>Beránek, D.</b> (2026). <em>Digital Identity Optimization (DIO): A Conceptual Framework for Entity-Based Visibility in the Age of AI-Mediated Search</em>. Zenodo. <a href="https://doi.org/10.5281/zenodo.21839423" target="_blank">https://doi.org/10.5281/zenodo.21839423</a></p></div><div class="quote">An open-source project is not merely a repository of code. It is a living digital entity whose identity is continuously distributed across code, packages, documentation, forks, contributors, maintainers, releases, governance, security, community discourse, knowledge systems, and AI-generated reconstructions.</div><p class="lead" style="margin-top:20px"><b>The project changes.</b><br>Its identity should remain intelligible.</p>`));
const deck=document.getElementById('deck');deck.innerHTML=slides.join('');const ss=[...document.querySelectorAll('.s')],dots=document.getElementById('dots'),cnt=document.getElementById('cnt');let cur=0;ss.forEach((_,i)=>{let d=document.createElement('i');d.className='dot'+(!i?' on':'');d.onclick=()=>go(i);dots.appendChild(d)});function go(n){cur=(n+ss.length)%ss.length;ss.forEach((s,i)=>s.classList.toggle('on',i===cur));document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));cnt.textContent=`${cur+1} / ${ss.length}`}function step(n){go(cur+n)}prev.onclick=()=>step(-1);next.onclick=()=>step(1);document.onkeydown=e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();step(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1)}};let x=0;document.ontouchstart=e=>x=e.touches[0].clientX;document.ontouchend=e=>{let d=x-e.changedTouches[0].clientX;if(Math.abs(d)>50)step(d>0?1:-1)};go(0);
</script></body></html>
